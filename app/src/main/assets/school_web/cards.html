<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, user-scalable=no">
<title>운전 카드 예시 앱</title>
<!-- 초보 탈출 학교 재정비 — "운전 카드" 예시 앱 (기획팀 2026-11-09, 현규 요청). 실제 판정 없음, 시연 버튼으로 흉내 -->
<style>
/* 레이아웃: 차 화면 16:9. 홈은 왼쪽 큰 "운전 카드"(지금 연습할 카드가 움직임) + 오른쪽 두 칸(방금 주행·내 기록). 이모지 없이 선 아이콘·숫자로 */
:root{--bg:#EEF1F5;--sf:#fff;--ln:#E1E6EC;--tx:#141A22;--sub:#4A5564;--hint:#5F6B7A;--pr:#2E6BF6;--prs:#E8EFFE;--road:#D3D8DF;--gold:#B57A00;--golds:#FFF4D6;--bad:#C9353A;--ok:#1B7F48;--oks:#E4F4EA
;--f:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#C9CFD7;font-family:var(--f);color:var(--tx);display:flex;justify-content:center;padding:16px}
#car{width:100%;max-width:1280px;aspect-ratio:16/9;background:var(--bg);border-radius:18px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:20px 32px 8px}
.top h1{font-size:26px;margin:0;font-weight:700;flex:1;letter-spacing:-.3px}
.ib{border:0;background:var(--sf);border-radius:14px;min-width:56px;height:56px;font-size:18px;cursor:pointer;color:var(--sub);padding:0 16px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib svg{width:26px;height:26px}
.ib:focus-visible,.hero:focus-visible,.panel:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.back{color:var(--pr)}
.scr{flex:1;overflow:auto;padding:10px 32px 28px}
.brand{display:flex;align-items:center;gap:14px;flex:1}
.mark{width:44px;height:44px;border-radius:12px;background:var(--tx);display:flex;align-items:center;justify-content:center}
.brand h1{flex:none}
.state{font-size:15px;color:var(--sub);background:var(--sf);border-radius:999px;padding:6px 14px;display:inline-flex;align-items:center;gap:8px}
.state i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.home{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;height:100%;padding:8px 0 0}
.hero{background:var(--sf);border-radius:24px;overflow:hidden;display:grid;grid-template-rows:1fr auto;cursor:pointer;border:0;padding:0;text-align:left;font-family:inherit;color:inherit}
.hero .scene{height:100%;width:100%;object-fit:cover}
.hero-sc{background:#f1f3f6;min-height:0;display:flex}
.hero-sc svg{width:100%;height:100%}
.hero-b{padding:22px 28px 26px;display:grid;grid-template-columns:1fr auto;gap:6px 24px;align-items:end}
.eb{font-size:14px;font-weight:600;letter-spacing:1.2px;color:var(--pr)}
.hero h2{font-size:32px;margin:2px 0 0;letter-spacing:-.5px;text-wrap:balance}
.hero p{font-size:18px;color:var(--sub);margin:4px 0 0;line-height:1.5;grid-column:1}
.meter{grid-column:1;display:flex;gap:4px;margin-top:14px}
.meter span{flex:1;height:8px;border-radius:4px;background:var(--ln)}
.meter span.f{background:var(--gold)}
.meta{grid-column:1;font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.cta{grid-column:2;grid-row:1 / span 4;align-self:end;background:var(--pr);color:#fff;border-radius:16px;padding:16px 26px;font-size:19px;font-weight:600;white-space:nowrap}
.side{display:grid;grid-template-rows:1fr 1fr auto;gap:16px;min-height:0}
.park{flex-direction:row;align-items:center;gap:16px;padding:16px 22px}
.park .pi{width:52px;height:52px;border-radius:14px;background:var(--tx);display:flex;align-items:center;justify-content:center;flex:none}
.park b{font-size:20px}.park small{display:block;font-size:14px;color:var(--sub);margin-top:2px}
.panel{background:var(--sf);border-radius:24px;padding:22px 26px;display:flex;flex-direction:column;gap:10px;cursor:pointer;border:0;text-align:left;font-family:inherit;color:inherit;min-height:0}
.panel:hover,.hero:hover{box-shadow:0 0 0 2px var(--prs)}
.ph-h{display:flex;justify-content:space-between;align-items:baseline}
.ex{font-size:12px;color:var(--hint);border:1px solid var(--ln);border-radius:6px;padding:1px 6px}
.big{display:flex;gap:28px;align-items:baseline;font-variant-numeric:tabular-nums}
.big b{font-size:40px;font-weight:700;letter-spacing:-1px}
.big small{font-size:16px;color:var(--sub);margin-left:4px;font-weight:500}
.pairs{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.pr{font-size:15px;border-radius:10px;padding:6px 12px;background:var(--oks);color:var(--ok)}
.pr.n{background:#FDECEC;color:var(--bad)}
.spark{margin-top:auto;width:100%;height:70px}
.go{font-size:15px;color:var(--pr);font-weight:600}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:10px 18px;font-size:16px;background:var(--sf);color:var(--sub);cursor:pointer;font-family:inherit}
.chip.on{background:var(--tx);color:#fff}
.sum{margin-left:auto;font-size:17px;color:var(--sub)}
.sum b{color:var(--gold)}
.tier{margin:18px 0 10px;display:flex;align-items:baseline;gap:12px}
.tier h3{font-size:21px;margin:0}
.tier .note{font-size:15px;color:var(--hint)}
.tier .lock{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--sf);border-radius:18px;overflow:hidden;cursor:pointer;border:2px solid transparent;position:relative}
.card.m{border-color:#F2CF6B}
.card.lk .scene{filter:grayscale(.7);opacity:.7}
.scene{display:block;width:100%;height:auto}
.cb{padding:12px 14px 14px}
.cb h4{font-size:18px;margin:0}
.cb .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.st{font-size:14px;color:var(--sub)}
.st.m{color:var(--gold);font-weight:700}
.dots{display:flex;gap:4px}.dot{width:10px;height:10px;border-radius:50%;background:var(--ln)}.dot.f{background:var(--pr)}
.vo{font-size:13px;border-radius:8px;padding:3px 8px;background:var(--prs);color:var(--pr)}
.vo.off{background:var(--bg);color:var(--hint)}
.grade{font-size:13px;border-radius:8px;padding:3px 8px;background:var(--prs);color:var(--pr)}
.grade.e{background:var(--bg);color:var(--sub)}
.ov{position:absolute;inset:0;background:rgba(25,31,40,.45);display:flex;align-items:center;justify-content:center;z-index:5}
.dlg{background:var(--sf);border-radius:24px;width:min(1000px,92%);max-height:92%;overflow:auto;display:grid;grid-template-columns:1.15fr 1fr}
.dlg .l{background:#f1f3f6}
.dlg .r{padding:26px 28px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:28px;margin:0}
.dlg .d{font-size:18px;color:var(--sub);margin:0;line-height:1.5}
.basis{font-size:15px;color:var(--sub);background:var(--bg);border-radius:12px;padding:10px 14px;line-height:1.5}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:18px;border-top:1px solid var(--ln);padding-top:12px}
.sw{width:64px;height:36px;border-radius:999px;background:var(--ln);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--pr)}.sw.on::after{left:32px}
.sw:disabled{opacity:.45;cursor:not-allowed}
.why{font-size:14px;color:var(--bad);margin-top:-6px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:17px;cursor:pointer;font-family:inherit;background:var(--bg);color:var(--tx)}
.btn.p{background:var(--pr);color:#fff}
.btn.g{background:var(--golds);color:var(--gold)}
.demo{display:flex;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--ln);padding-top:12px}
.demo span{font-size:13px;color:var(--hint);width:100%}
.mc{background:var(--sf);border-radius:26px;width:min(520px,80%);overflow:hidden;border:4px solid #F2CF6B;text-align:center;animation:pop .45s ease-out}
.mc .hd{background:var(--golds);color:var(--gold);font-weight:800;font-size:18px;padding:12px;letter-spacing:2px}
.mc h2{font-size:30px;margin:16px 0 4px}
.mc .scene{max-height:190px;width:auto;margin:0 auto}
.mc p{font-size:17px;color:var(--sub);margin:4px 20px 18px;line-height:1.5}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.ph{display:flex;align-items:center;justify-content:center;height:100%;font-size:20px;color:var(--hint);text-align:center;line-height:1.6}
.tag{position:absolute;top:10px;left:10px;font-size:13px;border-radius:8px;padding:3px 9px;background:var(--golds);color:var(--gold);font-weight:700}

/* 앱(WebView): 차 화면 전체를 쓴다. 판단: 원본 16:9 틀(1280px)을 화면 폭에 맞춰 키움 */
body{padding:0;background:var(--bg);height:100vh;overflow:hidden}
#car{max-width:none;aspect-ratio:auto;height:100vh;border-radius:0}
*{animation:none!important;transition:none!important}
</style>
</head>

<script>

const SCENES={

{id:'seat_heat',t:4,title:'히터 대신 열선',d:'히터 온도를 낮추고 열선을 쓰면 주행거리에 도움돼요.',g:'직접',basis:'현대 사용설명서 \'전기차 주행 정보\'',rule:'히터 26℃ + 열선 꺼짐이 5분 이어지는지 봐요 [가정]'},

const NEED=3; // 실수 없는 주행 연속 횟수

// ── 상태 (이 브라우저에만 저장) ──
let S={};
const loadS=()=>{try{return JSON.parse((window.Android?Android.loadState():localStorage.getItem('dc_state'))||'{}')}catch(e){return {}}};
S=loadS();
CARDS.forEach(c=>{if(!S[c.id])S[c.id]={streak:0,m:null,coach:c.t===1}});
const save=()=>{try{if(window.Android)Android.saveState(JSON.stringify(S));else localStorage.setItem('dc_state',JSON.stringify(S))}catch(e){}};
// 앱이 주는 실제 값 (방금 주행·내 기록·시연 모드). 앱 밖에서는 예시 그대로
let APP=null;const loadApp=()=>{try{APP=window.Android?JSON.parse(Android.appData()):null}catch(e){APP=null}};loadApp();
function nav(k){if(window.Android)Android.open(k);else go({report:'ph1',record:'ph2',settings:'settings'}[k])}
// 앱에서 다른 화면을 갔다 오면 다시 읽어 그림
window.refreshApp=()=>{S=loadS();CARDS.forEach(c=>{if(!S[c.id])S[c.id]={streak:0,m:null,coach:c.t===1}});loadApp();if(view!=='cards'&&view!=='home')view='home';render();showNewMaster()};
const tierDone=n=>CARDS.filter(c=>c.t===n).every(c=>S[c.id].m);
const unlocked=n=>n===1||tierDone(n-1);
const masteredCount=()=>CARDS.filter(c=>S[c.id].m).length;

let view='home',filter='all',open=null,popup=null;
const $=document.getElementById('car');

function render(){
  let h='';
  if(view==='home'){
    const nx=nextCard(),T=TIERS.find(t=>t.n===nx.t),inT=CARDS.filter(c=>c.t===nx.t),doneT=inT.filter(c=>S[c.id].m).length;
    h=`<div class="top"><div class="brand"><span class="mark">${ICON.wheel}</span><h1>초보 탈출 학교</h1><span class="state"><i></i>P · 정차 중</span></div><button class="ib" onclick="nav('settings')" aria-label="설정">${ICON.gear}</button></div>
    <div class="scr"><div class="home">
    <button class="hero" onclick="go('cards')"><div class="hero-sc">${sceneSVG(nx.id,'hs')}</div><div class="hero-b">
      <span class="eb">운전 카드 · 다음 연습</span><h2>${nx.title}</h2><p>${nx.d}</p>
      <div class="meter">${inT.map(c=>`<span class="${S[c.id].m?'f':''}"></span>`).join('')}</div>
      <span class="meta">${T.name} ${doneT} / ${inT.length} 마스터 · 전체 ${masteredCount()} / ${CARDS.length}</span>
      <span class="cta">카드 보기</span></div></button>
    <div class="side">
      <button class="panel" onclick="nav('report')">${lastPanel()}</button>
      <button class="panel" onclick="nav('record')">${histPanel()}</button>
      <button class="panel park" onclick="location.href='sim.html'"><span class="pi">${ICON.park}</span><span style="flex:1"><b>연습 맵 사진</b><small>운전 카드마다 연습 장면이 있어요</small></span><span class="go">들어가기</span></button>
    </div></div></div>`;
  } else if(view==='cards'){
    h=`<div class="top"><button class="ib back" onclick="go('home')">← 홈</button><h1>운전 카드</h1></div><div class="scr">
    <div class="bar">${['all:전체','prac:연습 중','m:마스터','on:주행 중 안내 켬'].map(x=>{const[k,v]=x.split(':');return `<button class="chip ${filter===k?'on':''}" onclick="setF('${k}')">${v}</button>`}).join('')}
    <span class="sum">마스터 <b>${masteredCount()}</b> / ${CARDS.length}</span></div>
    ${TIERS.map(T=>{const list=CARDS.filter(c=>c.t===T.n&&pass(c));if(!list.length)return '';const u=unlocked(T.n);
      const note=u?(T.n===1?T.note:'열렸어요 · 안내를 켤 수 있어요'):`<span class="lock">${T.n-1}단계를 모두 마스터하면 안내를 켤 수 있어요</span> · 카드는 미리 읽어도 돼요`;
      return `<div class="tier"><h3>${T.name}${tierDone(T.n)?' <span style="color:var(--gold)">★ 마스터</span>':''}</h3><span class="note">${note}</span></div><div class="grid">${list.map(cardHTML).join('')}</div>`}).join('')}
    </div>`;
  } else if(view==='settings'){
    h=`<div class="top"><button class="ib back" onclick="go('home')">← 홈</button><h1>설정</h1></div><div class="scr"><div class="ph"><div>코치 음성 · 코치 근거 · 시연 모드는 다음 단계에서 정해요.<br><br><button class="btn" onclick="resetAll()">시연 기록 모두 지우기</button></div></div></div>`;
  } else {
    const n={ph1:'방금 주행',ph2:'내 기록'}[view];
    h=`<div class="top"><button class="ib back" onclick="go('home')">← 홈</button><h1>${n}</h1></div><div class="scr"><div class="ph">이 화면은 다음 단계에서 다시 정해요.<br>지금 예시는 "운전 카드"만 움직여요.</div></div>`;
  }
  if(open)h+=detailHTML(CARDS.find(c=>c.id===open));
  if(popup)h+=popup;
  $.innerHTML=h;
}
const ICON={
 park:'<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"/></svg>',
 wheel:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.2"/><path d="M3.5 10.5h6.3M14.2 10.5h6.3M12 14.2V21"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'};
function nextCard(){for(const T of TIERS){if(!unlocked(T.n))break;const c=CARDS.find(c=>c.t===T.n&&!S[c.id].m);if(c)return c}return CARDS[0]}
function spark(vals){const v=vals||[40,55,50,70,65,80,75,90,100,100],w=300,h=70,bw=w/Math.max(v.length,1);
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="최근 ${v.length}번 깜빡이 비율">${v.map((x,i)=>`<rect x="${i*bw+3}" y="${h-x*.62-4}" width="${bw-6}" height="${x*.62}" rx="3" fill="${i>=v.length-2?'#2E6BF6':'#D3D8DF'}"/>`).join('')}</svg>`}
function lastPanel(){const L=APP&&APP.last;
  if(!L)return `<div class="ph-h"><span class="eb">방금 주행</span><span class="ex">예시</span></div><div class="big"><span><b>8.2</b><small>km</small></span><span><b>23</b><small>분</small></span></div><div class="pairs"><span class="pr">꺾기 전 깜빡이 5 / 5</span><span class="pr n">켜 둔 채 1번</span></div>`;
  return `<div class="ph-h"><span class="eb">방금 주행</span><span class="ex" style="background:var(--prs);color:var(--pr)">${L.when}</span></div><div class="big"><span><b>${L.km}</b><small>${L.unit||'km'}</small></span><span><b>${L.score}</b><small>점</small></span></div><div class="pairs"><span class="pr">꺾기 전 깜빡이 ${L.sig} / ${L.turns}</span><span class="pr ${L.leftOn?'n':''}">켜 둔 채 ${L.leftOn}번</span></div>`}
function histPanel(){const H=APP&&APP.hist;
  if(!H||!H.length)return `<div class="ph-h"><span class="eb">내 기록</span><span class="ex">예시</span></div><span style="font-size:17px;color:var(--sub)">꺾기 전 깜빡이 · 최근 10번</span>${spark()}`;
  return `<div class="ph-h"><span class="eb">내 기록</span><span class="ex" style="background:var(--prs);color:var(--pr)">주행 ${APP.trips}번</span></div><span style="font-size:17px;color:var(--sub)">꺾기 전 깜빡이 · 최근 ${H.length}번</span>${spark(H)}`}
// 주행 기록으로 새로 마스터한 카드 (앱이 채움): 홈에 오면 한 장씩 보여 줌
function showNewMaster(){const ids=(APP&&APP.newMaster)||[];if(!ids.length||popup)return;const c=CARDS.find(x=>x.id===ids[0]);if(!c)return;
  APP.newMaster=ids.slice(1);if(window.Android)Android.ackMaster(c.id);
  popup=masterCard(c,`실수 없이 ${NEED}번 연속 해냈어요.<br>이제 주행 중 안내는 꺼 둘게요. 언제든 다시 켤 수 있어요.`,'마스터 카드');render()}
function pass(c){const s=S[c.id];return filter==='all'||(filter==='m'&&s.m)||(filter==='prac'&&!s.m)||(filter==='on'&&s.coach&&unlocked(c.t))}
function dots(c){if(c.g==='카드만'||c.g==='안내만')return '';let d='';for(let i=0;i<NEED;i++)d+=`<span class="dot ${i<S[c.id].streak?'f':''}"></span>`;return `<span class="dots">${d}</span>`}
function cardHTML(c){const s=S[c.id],u=unlocked(c.t),on=s.coach&&u;
  const st=s.m?`<span class="st m">★ 마스터${s.m==='self'?' (직접 표시)':''}</span>`:`<span class="st">연습 중</span>`;
  return `<div class="card ${s.m?'m':''} ${u?'':'lk'}" onclick="openCard('${c.id}')">${sceneSVG(c.id)}<div class="cb"><h4>${c.title}</h4><div class="row">${st}${dots(c)}</div><div class="row"><span class="grade ${/^(직접|계산)/.test(c.g)?'':'e'}">${c.g}</span><span class="vo ${on?'':'off'}">${on?'안내 켬':'안내 끔'}</span></div></div>${s.m==='auto'?'<span class="tag">마스터 카드</span>':''}</div>`}
function detailHTML(c){const s=S[c.id],u=unlocked(c.t),judge=!(c.g==='카드만'||c.g==='안내만');
  const prog=s.m?`<b style="color:var(--gold)">★ 마스터${s.m==='self'?' (직접 표시)':''}</b>`:judge?`실수 없는 주행 ${s.streak} / ${NEED}번 연속`:'판정하지 않아요 · 직접 표시만';
  return `<div class="ov" onclick="if(event.target===this)closeCard()"><div class="dlg"><div class="l">${sceneSVG(c.id)}<div style="padding:14px 18px"><div class="basis"><b>앱이 보는 것</b><br>${c.rule}</div></div></div><div class="r">
  <div style="display:flex;justify-content:space-between;align-items:center"><span class="grade ${/^(직접|계산)/.test(c.g)?'':'e'}">${c.g}${c.g==='추정'?' · 점수 안 씀':''}</span><button class="ib" style="height:44px;min-width:44px" onclick="closeCard()" aria-label="닫기">✕</button></div>
  <h2>${c.title}</h2><p class="d">${c.d}</p><div class="basis">근거 · ${c.basis}</div>
  <div class="line"><span>진행</span><span>${prog}</span></div>
  <div class="line"><span>주행 중 안내</span><button class="sw ${s.coach&&u?'on':''}" ${u?'':'disabled'} onclick="toggleCoach('${c.id}')" aria-label="주행 중 안내"></button></div>
  ${u?'':`<div class="why">${c.t-1}단계를 모두 마스터하면 켤 수 있어요. 안전부터 익혀요.</div>`}
  <button class="btn p" onclick="location.href='sim.html#${c.id}'">연습 맵 사진 보기</button>
  <button class="btn ${s.m==='self'?'':'g'}" onclick="selfMark('${c.id}')">${s.m==='self'?'직접 표시 취소':s.m?'마스터 완료':'이미 할 줄 알아요 (직접 표시)'}</button>
  ${judge&&(!APP||APP.demo)?`<div class="demo"><span>시연용 · 실제 앱에서는 주행 기록이 자동으로 채워요</span><button class="btn p" onclick="drive('${c.id}',true)">실수 없는 주행 +1</button><button class="btn" onclick="drive('${c.id}',false)">실수 1번 (처음부터)</button></div>`:''}
  </div></div></div>`}

function go(v){view=v;open=null;popup=null;render()}
function setF(f){filter=f;render()}
function openCard(id){open=id;render()}
function closeCard(){open=null;render()}
function toggleCoach(id){const c=CARDS.find(x=>x.id===id);if(!unlocked(c.t))return;S[id].coach=!S[id].coach;save();render()}
function selfMark(id){const s=S[id];const before=CARDS.find(x=>x.id===id).t;const was=tierDone(before);
  if(s.m==='self'){s.m=null;s.streak=0;s.coach=true}else if(!s.m){s.m='self';s.coach=false}
  save();checkTier(before,was);render()}
function drive(id,ok){const s=S[id];if(s.m)return;const c=CARDS.find(x=>x.id===id);const was=tierDone(c.t);
  if(!ok){s.streak=0;save();render();return}
  s.streak++;if(s.streak>=NEED){s.m='auto';s.coach=false;save();
    popup=masterCard(c,`실수 없이 ${NEED}번 연속 해냈어요.<br>이제 주행 중 안내는 꺼 둘게요. 언제든 다시 켤 수 있어요.`,'마스터 카드');
    open=null;render();setTimeout(()=>checkTier(c.t,was,true),0);return}
  save();render()}
function checkTier(n,was,queued){if(!was&&tierDone(n)){const next=TIERS.find(T=>T.n===n+1);
  if(next)CARDS.filter(c=>c.t===n+1).forEach(c=>{S[c.id].coach=!S[c.id].m});save();
  const html=`<div class="ov" onclick="if(event.target===this)closePop()"><div class="mc"><div class="hd">단계 마스터</div><h2>${TIERS[n-1].name} ★</h2><p>${next?`이제 <b>${next.name}</b> 안내가 열렸어요.`:'모든 단계를 마스터했어요.'}</p><div style="padding:0 20px 22px"><button class="btn p" onclick="closePop()">좋아요</button></div></div></div>`;
  if(queued&&popup){window._next=html}else{popup=html;render()}}}
function masterCard(c,msg,hd){return `<div class="ov" onclick="if(event.target===this)closePop()"><div class="mc"><div class="hd">${hd}</div>${sceneSVG(c.id)}<h2>${c.title}</h2><p>${msg}</p><div style="padding:0 20px 22px"><button class="btn p" onclick="closePop()">받기</button></div></div></div>`}
function closePop(){popup=window._next||null;window._next=null;render();if(!popup)showNewMaster()}
function resetAll(){S={};CARDS.forEach(c=>S[c.id]={streak:0,m:null,coach:c.t===1});save();go('home')}
// 앱: 그림을 멈춘 한 장면으로 (애니메이션 끔). 카드 그림은 FREEZE 비율, 나머지 그림은 0.3초 지점
const FREEZE={"signal_on": 0.4, "signal_off": 0.6, "park_p": 0.8, "headlight": 0.4, "rain": 0.4, "right_red": 0.6, "left_wait": 0.4, "one_lane": 0.2, "soft_stop": 0.6, "bump": 0.2, "rain_light": 0.4, "high_beam": 0.4, "interior": 0.4, "fog": 0.4, "right_lane": 0.4, "exit_lane": 0.4, "merge": 0.6, "hw_stop": 0.4, "early_slow": 0.4, "wobble": 0.4, "cruise": 0.6, "seat_heat": 0.4, "manners": 0.4};
function freezeScenes(){document.querySelectorAll('svg').forEach(s=>{if(!s.pauseAnimations)return;const id=s.dataset.scene;let t=0.3;if(id&&FREEZE[id]!=null){const d=Math.max(0,...[...s.querySelectorAll('animate,animateMotion,animateTransform')].map(a=>parseFloat(a.getAttribute('dur'))||0));t=d*FREEZE[id]}s.pauseAnimations();s.setCurrentTime(t)})}
const _render=render;render=function(){_render();freezeScenes()};
render();showNewMaster();
</script>
